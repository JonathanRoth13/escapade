[package]
name = "escapade"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tikv-jemallocator = "0.5"
anyhow = "1.0.100"
num-format = "0.4.4"
rand = "0.9.2"
rand_chacha = "0.9"
memmap2 = "0.9.8"
rayon = "1.10"
xxhash-rust = {version = "0.8.15", features = ["xxh3"]}
bitvec = "1.0"
crossbeam-channel = "0.5"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
codegen-units = 1
lto = "thin"      # Enable thin LTO for cross-crate inlining (2-5% faster)
opt-level = 3     # Maximum optimization level
debug = true      # Enable debug symbols for profiling (no runtime overhead)

# macOS-only: needed for performance/efficiency core probing
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
